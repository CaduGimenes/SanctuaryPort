name: Bug report
description: Visual glitch, crash, audio issue, or anything that doesn't behave as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening: search existing issues for your GPU/error first, it may already be tracked.

  - type: input
    id: version
    attributes:
      label: Port version
      description: Shown in the launcher title bar (e.g. v0.7.6)
      placeholder: v0.7.6
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU and driver version
      placeholder: "RX 6600, Adrenalin 26.8.1"
    validations:
      required: true

  - type: input
    id: cpu
    attributes:
      label: CPU
      placeholder: "Ryzen 7 5700X"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you expected vs what actually happened
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: user/last_run.log or user/last_crash.log
      description: "After a crash, attach user/last_crash.log (written automatically). For other problems, turn on Advanced > Troubleshooting > Save a log of each start in the launcher, play until it happens, and attach user/last_run.log (drag and drop it here)."
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: Especially for visual glitches, attach the raw in-game capture, not a photo of the screen when possible.
    validations:
      required: false
